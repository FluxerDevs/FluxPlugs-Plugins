name: verify-whitelist

# verified.json pins the code hashes maintainers have reviewed. This checks
# that every entry matches a plugin's current hash and that the change comes
# from a maintainer.
on:
  pull_request:
    paths:
      - verified.json

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the toolchain pin
        id: toolchain
        run: |
          echo "repository=$(node -p "require('./toolchain.json').fluxplugs.repository")" >> "$GITHUB_OUTPUT"
          echo "ref=$(node -p "require('./toolchain.json').fluxplugs.ref")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.toolchain.outputs.repository }}
          ref: ${{ steps.toolchain.outputs.ref }}
          path: fluxplugs
          # FLUXPLUGS_TOKEN is needed while the FluxPlugs repository is
          # private; without it the repository's own token is used.
          token: ${{ secrets.FLUXPLUGS_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: >
          node fluxplugs/scripts/community/check-verified.mjs
          --root .
          --author "${{ github.event.pull_request.user.login }}"
