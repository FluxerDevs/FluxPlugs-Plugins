name: verify-whitelist

# verified.json pins the code hashes maintainers have reviewed. This checks
# that every entry matches a plugin's current hash and that the change comes
# from a maintainer.
on:
  pull_request:
    paths:
      - verified.json

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the toolchain pin
        id: toolchain
        run: echo "ref=$(node -p "require('./toolchain.json').fluxplugs.ref")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FluxerDevs/FluxPlugs
          ref: ${{ steps.toolchain.outputs.ref }}
          path: fluxplugs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: >
          node fluxplugs/scripts/community/check-verified.mjs
          --root .
          --author "${{ github.event.pull_request.user.login }}"
