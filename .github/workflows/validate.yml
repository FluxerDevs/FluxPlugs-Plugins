name: validate

# Checks the one plugin a pull request changes, with the scripts and the
# plugin toolchain of the FluxPlugs commit pinned in toolchain.json.
on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read the toolchain pin
        id: toolchain
        run: echo "ref=$(node -p "require('./toolchain.json').fluxplugs.ref")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FluxerDevs/FluxPlugs
          ref: ${{ steps.toolchain.outputs.ref }}
          path: fluxplugs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fluxplugs/pnpm-lock.yaml
      - run: pnpm --dir fluxplugs install --frozen-lockfile
      - run: pnpm --dir fluxplugs --filter @fluxplugs/plugin-tools... build
      - name: Validate the changed plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          node fluxplugs/scripts/community/validate.mjs
          --root .
          --base "origin/${{ github.base_ref }}"
          --author "${{ github.event.pull_request.user.login }}"
